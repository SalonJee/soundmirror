[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soundmirror"
version = "0.1.0"
description = "Mirror audio output to two Bluetooth headsets (e.g. AirPods) on Ubuntu"
requires-python = ">=3.10"
dependencies = [
    "PyGObject",
    "dbus-python",
]

[project.scripts]
soundmirror = "soundmirror.main:main"

[tool.setuptools.packages.find]
where = ["."]
